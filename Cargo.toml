[package]
name = "rsort"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "Sort, merge or check lines of text files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkjt2/rsort"
readme = "README.md"
keywords = ["cli"]
categories = ["command-line-utilities"]
include = ["src/**/*", "cli.toml", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md"]

[[bin]]
name = "rsort"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "string", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
libc = "0.2.191"
miette = { version = "7.6.0", features = ["fancy-no-backtrace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
jsonschema = { version = "0.60.2", default-features = false }
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package]
insta.opt-level = 3
